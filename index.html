<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLUD Leasing Tracker</title>
<style>
  :root{
    --font-serif: ui-serif, Georgia, "Times New Roman", serif;
    /* Primary accent — brass */
    --teal-700:#a3792f; --teal-800:#87611f;
    /* Warm paper neutrals (kept the old variable names so every existing
       var(--stone-*) reference re-themes automatically) */
    --stone-50:#f7f5ee; --stone-100:#efeadb; --stone-200:#e2dbc4; --stone-300:#cfc4a2;
    --stone-400:#9c9070; --stone-500:#6f6650; --stone-600:#4c4534; --stone-700:#332e21; --stone-800:#2a2519; --stone-900:#211d14;
    /* Sidebar — deep ledger navy */
    --navy-900:#182536; --navy-800:#213247; --cream:#f3efe4; --cream-dim:#9aa6b6;
    --amber-50:#fdf8ee; --amber-100:#f6e8c8; --amber-200:#edd196; --amber-500:#c98a1f; --amber-700:#96650f; --amber-800:#764e0c;
    --blue-100:#dfe6ee; --blue-500:#4d6f93; --blue-700:#345069; --blue-800:#293f53;
    --emerald-100:#dde8dc; --emerald-500:#5c8a5a; --emerald-700:#3c6339; --emerald-800:#2f4e2d;
    --rose-50:#faeeec; --rose-100:#f2dad5; --rose-600:#a34a3a; --rose-700:#8a3c2e; --rose-800:#6e2f24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--stone-50); color:var(--stone-900); font-size:14px; line-height:1.45;
  }
  #root{min-height:100vh;}
  .icon{display:inline-block; vertical-align:middle; flex-shrink:0;}
  .icon.spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* layout */
  .app{display:flex; min-height:100vh;}
  .sidebar{display:flex; flex-direction:column; width:250px; flex-shrink:0; background:var(--navy-900);
    position:sticky; top:0; align-self:flex-start; height:100vh;}
  .sidebar-brand{display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--navy-800); padding:20px;}
  .sidebar-brand .mark{width:30px; height:30px; flex-shrink:0; border:1px solid var(--amber-500); border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-size:15px; color:var(--amber-500);}
  .sidebar-brand h1{font-family:var(--font-serif); font-size:17px; font-weight:600; margin:0; color:var(--cream); line-height:1.2;}
  .sidebar-brand p{font-size:11px; margin:1px 0 0; color:var(--cream-dim);}
  .nav{flex:1; overflow-y:auto; padding:16px 10px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding:9px 12px; border-radius:6px; font-size:14px; font-weight:500; color:var(--cream-dim); border-left:3px solid transparent;}
  .nav-item:hover{background:var(--navy-800); color:var(--cream);}
  .nav-item.active{background:var(--navy-800); color:var(--cream); border-left:3px solid var(--amber-500);}
  .sidebar-footer{border-top:1px solid var(--navy-800); padding:14px 16px;}
  .sidebar-user-name{font-size:14px; font-weight:500; color:var(--cream); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-user-role{font-size:12px; color:var(--cream-dim); margin:1px 0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .banner{display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--amber-200); background:var(--amber-50); color:var(--amber-700); padding:8px 24px; font-size:12px;}
  .main{flex:1; max-width:1152px; width:100%; margin:0 auto; padding:28px 28px 48px;}
  h1.page-title{font-family:var(--font-serif); font-size:19px; font-weight:600; margin:0; color:var(--stone-900);}
  p.page-sub{font-size:13px; color:var(--stone-500); margin:2px 0 0;}

  /* buttons */
  .btn{display:inline-flex; align-items:center; gap:6px; border-radius:6px; padding:8px 14px; font-size:14px; font-weight:500; border:1px solid transparent; cursor:pointer; position:relative; overflow:hidden;}
  .btn:disabled{cursor:default; opacity:.85;}
  .btn-progress-track{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.28); overflow:hidden;}
  .btn-progress-fill{position:absolute; top:0; bottom:0; width:36%; background:#fff; border-radius:2px; animation:btn-indeterminate 1.1s ease-in-out infinite;}
  @keyframes btn-indeterminate{0%{left:-36%;} 100%{left:100%;}}
  .btn-primary{background:var(--teal-700); color:#fff;}
  .btn-primary:hover{background:var(--teal-800);}
  .btn-outline{background:#fff; border-color:var(--stone-300); color:var(--stone-700);}
  .btn-outline:hover{background:var(--stone-50);}
  .btn-danger{background:var(--rose-600); color:#fff;}
  .btn-danger:hover{background:var(--rose-700);}
  .btn-block{width:100%; justify-content:center;}
  .btn-link{display:block; width:100%; text-align:center; background:none; border:none; color:var(--teal-700); font-size:13px; margin-top:12px; cursor:pointer; padding:4px;}
  .btn-link:hover{text-decoration:underline;}
  .icon-btn{border:none; background:none; cursor:pointer; padding:6px; border-radius:6px; color:var(--stone-400);}
  .icon-btn:hover{background:var(--stone-100); color:var(--teal-700);}
  .icon-btn.danger:hover{color:var(--rose-600);}

  /* sections / cards */
  h2.section-title{font-family:var(--font-serif); font-size:15px; font-weight:600; color:var(--stone-900); margin:0 0 14px;}
  .stack{display:flex; flex-direction:column; gap:24px;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{border:1px solid var(--stone-200); background:#fff; border-radius:8px; padding:16px; border-top:2px solid var(--teal-700);}
  .stat-label{font-size:12px; font-weight:500; color:var(--stone-500); margin:0;}
  .stat-value{font-family:var(--font-serif); font-size:26px; font-weight:600; margin:6px 0 0; color:var(--stone-900);}
  .stat-value.blue{color:var(--blue-700);}
  .stat-value.emerald{color:var(--emerald-700);}
  .stat-value.rose{color:var(--rose-700);}
  .stat-sub{font-size:12px; color:var(--stone-500); margin:4px 0 0;}

  .panel{border:1px solid var(--stone-200); background:#fff; border-radius:8px; padding:18px;}
  .two-col{display:grid; grid-template-columns:1fr; gap:24px;}
  @media(min-width:1024px){.two-col{grid-template-columns:1fr 1fr;}}

  .stage-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .stage-row:last-child{margin-bottom:0;}
  .stage-label{width:160px; flex-shrink:0; font-size:12px; color:var(--stone-600);}
  .stage-track{flex:1; height:7px; border-radius:3px; background:var(--stone-100); overflow:hidden;}
  .stage-fill{height:100%; border-radius:3px;}
  .stage-count{width:24px; flex-shrink:0; text-align:right; font-size:12px; font-weight:500; color:var(--stone-700);}

  table.mini{width:100%; border-collapse:collapse; font-size:12px;}
  table.mini th{text-align:left; font-weight:500; color:var(--stone-400); padding-bottom:8px;}
  table.mini th.right, table.mini td.right{text-align:right;}
  table.mini td{padding:8px 0; border-top:1px solid var(--stone-100); color:var(--stone-600);}
  table.mini td.first{color:var(--stone-700);}

  .pipeline-item{display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left;
    background:none; border:none; border-top:1px solid var(--stone-100); padding:12px 0; cursor:pointer;}
  .pipeline-item:first-child{border-top:none;}
  .pipeline-item:hover{background:var(--stone-50);}
  .pipeline-main p{margin:0; font-size:14px; font-weight:500; color:var(--stone-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pipeline-sub{margin:2px 0 0; font-size:12px; color:var(--stone-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .empty-note{padding:24px 0; text-align:center; font-size:14px; color:var(--stone-500);}

  .badge{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:500;}
  .badge .dot{width:6px; height:6px; border-radius:999px;}
  .badge.st-slate{background:var(--stone-100); color:var(--stone-700);}
  .badge .dot.d-slate{background:var(--stone-400);}
  .badge.st-amber{background:var(--amber-100); color:var(--amber-800);}
  .badge .dot.d-amber{background:var(--amber-500);}
  .badge.st-blue{background:var(--blue-100); color:var(--blue-800);}
  .badge .dot.d-blue{background:var(--blue-500);}
  .badge.st-emerald{background:var(--emerald-100); color:var(--emerald-800);}
  .badge .dot.d-emerald{background:var(--emerald-500);}
  .badge.st-rose{background:var(--rose-100); color:var(--rose-800);}
  .badge .dot.d-rose{background:var(--rose-600);}

  .status-pill{display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:500;}
  .status-pill.available{background:var(--emerald-100); color:var(--emerald-800);}
  .status-pill.occupied{background:var(--stone-200); color:var(--stone-700);}
  .status-pill.active{background:var(--amber-100); color:var(--amber-800);}

  /* toolbar / filters */
  .toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px;}
  .search-wrap{position:relative; flex:1; min-width:200px;}
  .search-wrap .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--stone-400); pointer-events:none;}
  .search-wrap input{padding-left:34px;}
  .input, select.input, textarea.input{
    width:100%; border:1px solid var(--stone-300); background:#fff; border-radius:6px; padding:8px 12px;
    font-size:14px; color:var(--stone-900); outline:none; font-family:inherit;
  }
  .input:focus{border-color:var(--teal-700); box-shadow:0 0 0 1px var(--teal-700);}
  select.input.auto{width:auto;}
  textarea.input{resize:vertical;}

  /* table */
  .table-wrap{border:1px solid var(--stone-200); background:#fff; border-radius:8px; overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table.data{width:100%; min-width:900px; border-collapse:collapse; text-align:left; font-size:14px;}
  table.data.narrow{min-width:700px;}
  table.data thead{border-bottom:1px solid var(--stone-200);}
  table.data th{padding:11px 16px; font-size:12px; font-weight:600; color:var(--stone-600);}
  table.data th.right{text-align:right;}
  table.data td{padding:12px 16px; border-top:1px solid var(--stone-100); color:var(--stone-600); vertical-align:top;}
  table.data td.right{text-align:right;}
  table.data tbody tr:hover{background:var(--stone-50);}
  .cell-title{margin:0; font-weight:500; color:var(--stone-900);}
  .cell-sub{margin:2px 0 0; font-size:12px; color:var(--stone-500);}
  .row-actions{display:flex; justify-content:flex-end; gap:4px;}
  .link-count{background:none; border:none; padding:0; font-size:14px; font-weight:600; color:var(--teal-700); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .link-count:hover{color:var(--teal-800);}
  .chip{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 6px 5px 12px; font-size:12.5px; font-weight:500; background:var(--stone-100); color:var(--stone-700); border:1px solid var(--stone-200);}
  .chip.fixed{padding:5px 12px;}
  .chip button{border:none; background:var(--stone-200); color:var(--stone-600); width:16px; height:16px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; font-size:11px; line-height:1;}
  .chip button:hover{background:var(--rose-100); color:var(--rose-700);}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .add-option-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .add-option-row .input{width:auto; flex:1; min-width:140px;}
  .btn-xs{display:inline-flex; align-items:center; gap:4px; border-radius:6px; padding:5px 10px; font-size:12px; font-weight:500; border:1px solid var(--teal-700); color:var(--teal-700); background:#fff; cursor:pointer; white-space:nowrap;}
  .btn-xs:hover{background:var(--amber-50);}
  .empty-state{border:1px dashed var(--stone-300); background:#fff; border-radius:8px; padding:56px 16px; text-align:center;}
  .empty-state p.title{margin:0; font-size:14px; font-weight:500; color:var(--stone-700);}
  .empty-state p.sub{margin:4px 0 0; font-size:12px; color:var(--stone-500);}

  .property-block{margin-bottom:24px;}
  .property-block:last-child{margin-bottom:0;}
  .property-heading{display:flex; align-items:center; gap:8px; font-family:var(--font-serif); font-size:15px; font-weight:600; color:var(--stone-900); margin:0 0 8px;}
  .property-heading .icon{color:var(--teal-700);}

  /* modal */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(23,20,13,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{width:100%; max-width:640px; max-height:90vh; overflow-y:auto; background:#fff; border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal.narrow{max-width:420px;}
  .modal.confirm{max-width:380px; padding:24px;}
  .modal-header{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--stone-200); padding:16px 24px;}
  .modal-header h2{font-family:var(--font-serif); font-size:17px; font-weight:600; margin:0; color:var(--stone-900);}
  .modal-body{padding:20px 24px; display:flex; flex-direction:column; gap:16px;}
  .modal-footer{display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--stone-200); padding:16px 24px;}
  .field-label{display:block; font-size:12px; font-weight:500; color:var(--stone-600); margin-bottom:4px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-error{display:flex; align-items:center; gap:8px; background:var(--rose-50); color:var(--rose-700); border-radius:6px; padding:8px 12px; font-size:14px;}
  .estimate-line{font-size:14px; color:var(--stone-500); margin:0;}
  .estimate-line b{color:var(--stone-800); font-weight:500;}

  /* login */
  .login-page{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy-900); padding:16px;}
  .login-card{width:100%; max-width:380px; background:#fff; border:1px solid var(--stone-200); border-radius:10px; padding:32px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .login-brand .mark{width:34px; height:34px; border:1px solid var(--teal-700); border-radius:6px; color:var(--teal-700); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:var(--font-serif); font-size:15px;}
  .login-brand h1{font-family:var(--font-serif); font-size:16px; font-weight:600; margin:0; color:var(--stone-900);}
  .login-brand p{font-size:11px; margin:1px 0 0; color:var(--stone-500);}
  .login-lede{font-size:14px; color:var(--stone-600); margin:0 0 20px;}
  .login-fields{display:flex; flex-direction:column; gap:16px;}

  .spinner-wrap{display:flex; align-items:center; justify-content:center;}
  .spinner-wrap.full{min-height:100vh;}
  .spinner-wrap.h96{height:384px;}
  .spinner{color:var(--teal-700);}

  @media (max-width:720px){
    .grid-2{grid-template-columns:1fr;}
    .sidebar{width:76px;}
    .sidebar-brand h1, .sidebar-brand p, .nav-item span, .sidebar-user-name, .sidebar-user-role{display:none;}
    .sidebar-brand{justify-content:center;}
    .nav-item{justify-content:center;}
    .btn-block span{display:none;}
  }

  /* report-specific */
  .report-type-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .report-type-tab{border:1px solid var(--stone-300); background:#fff; color:var(--stone-600); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:500; cursor:pointer;}
  .report-type-tab.active{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
  .report-summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px;}
  @media(min-width:640px){.report-summary-grid{grid-template-columns:repeat(4,1fr);}}

  @media print{
    .sidebar, .banner, .no-print{display:none !important;}
    .main{max-width:100% !important; padding:0 !important; margin:0 !important;}
    .app{display:block !important;}
    body{background:#fff !important;}
    .panel, .table-wrap, .stat-card{border:1px solid #ccc !important; box-shadow:none !important;}
  }
</style>
</head>

async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const data = enc.encode(`${salt}:${password}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomSalt() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16))).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function computeListingStatus(listingKey, tenants) {
  const matches = tenants.filter((t) => keyOf(t.property, t.unit) === listingKey);
  if (matches.some((t) => t.status === "Awarded/ Leased")) return { label: "Occupied", kind: "occupied", count: matches.length };
  const active = matches.filter((t) => ["Inquired", "Pending Requirements", "Under Evaluation"].includes(t.status)).length;
  if (active > 0) return { label: `${active} Active Inquir${active === 1 ? "y" : "ies"}`, kind: "active", count: matches.length, active };
  return { label: "Available", kind: "available", count: matches.length };
}

// Session storage: uses window.storage when available (Claude artifact
// preview), falls back to plain localStorage everywhere else (e.g. the
// published GitHub Pages site) so sign-in survives a reload either way.
const sessionStore = {
  async get(key) {
    if (typeof window.storage !== "undefined") {
      try { return await window.storage.get(key, false); } catch (e) { /* fall through */ }
    }
    try {
      const v = localStorage.getItem(key);
      return v != null ? { key, value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    if (typeof window.storage !== "undefined") {
      try { return await window.storage.set(key, value, false); } catch (e) { /* fall through */ }
    }
    try { localStorage.setItem(key, value); return { key, value }; } catch (e) { return null; }
  },
  async delete(key) {
    if (typeof window.storage !== "undefined") {
      try { return await window.storage.delete(key, false); } catch (e) { /* fall through */ }
    }
    try { localStorage.removeItem(key); return { key, deleted: true }; } catch (e) { return null; }
  },
};

async function init() {
  try {
    const res = await sessionStore.get(USER_STORAGE_KEY);
    if (res && res.value) state.user = JSON.parse(res.value);
  } catch (e) { /* no active session */ }
  state.userLoading = false;
  if (state.user) await loadData();
  render();
}

async function loadData() {
  state.loading = true;
  try {
    const [tenantsRes, listingsRes, usersRes, maintRes, optionsRes] = await Promise.all([
      sb.from("plud_tenants").select("*"),
      sb.from("plud_listings").select("*"),
      sb.from("plud_users").select("id, username, name, role, created_at").order("created_at"),
      sb.from("plud_maintenance").select("*"),
      sb.from("plud_custom_options").select("*").order("created_at"),
    ]);
    if (tenantsRes.error) throw tenantsRes.error;
    if (listingsRes.error) throw listingsRes.error;
    if (usersRes.error) throw usersRes.error;
    if (maintRes.error) throw maintRes.error;
    if (optionsRes.error) throw optionsRes.error;

    if (tenantsRes.data.length === 0 && listingsRes.data.length === 0) {
      // First run against an empty database: seed it once.
      await sb.from("plud_tenants").upsert(SEED_TENANTS.map(tenantStateToRow));
      await sb.from("plud_listings").upsert(SEED_LISTINGS.map(listingStateToRow));
      state.tenants = SEED_TENANTS;
      state.listings = SEED_LISTINGS;
    } else {
      state.tenants = tenantsRes.data.map(tenantRowToState);
      state.listings = listingsRes.data.map(listingRowToState);
    }
    if (maintRes.data.length === 0) {
      await sb.from("plud_maintenance").upsert(SEED_MAINTENANCE.map(maintStateToRow));
      state.maintenance = SEED_MAINTENANCE;
    } else {
      state.maintenance = maintRes.data.map(maintRowToState);
    }
    state.customCategories = optionsRes.data.filter((o) => o.option_type === "category");
    state.customConcepts = optionsRes.data.filter((o) => o.option_type === "concept");
    state.customStatuses = optionsRes.data.filter((o) => o.option_type === "status");
    state.users = usersRes.data;
    state.saveError = "";
  } catch (e) {
    console.error("Supabase load failed:", e);
    state.tenants = SEED_TENANTS;
    state.listings = SEED_LISTINGS;
    state.maintenance = SEED_MAINTENANCE;
    state.users = [];
    state.customCategories = [];
    state.customConcepts = [];
    state.customStatuses = [];
    state.saveError = "Couldn't reach the database — showing local sample data, changes won't be saved.";
  }
  state.loading = false;
}

async function loginWithPassword(name, password) {
  try {
    const { data, error } = await sb
      .from("plud_users")
      .select("*")
      .eq("username", name.trim().toLowerCase())
      .maybeSingle();
    if (error) throw error;
    if (!data) { setLoginError("Incorrect username or password."); return; }

    const hash = await hashPassword(password, data.salt);
    if (hash !== data.password_hash) { setLoginError("Incorrect username or password."); return; }

    state.user = { id: data.id, name: data.username, role: data.role || "" };
    try { await sessionStore.set(USER_STORAGE_KEY, JSON.stringify(state.user)); } catch (e) {}
    state.loginError = "";
    await loadData();
    render();
  } catch (e) {
    console.error("Supabase login failed:", e);
    setLoginError("Couldn't reach the sign-in service. Try again.");
  }
}

async function logout() {
  state.user = null;
  try { await sessionStore.delete(USER_STORAGE_KEY); } catch (e) {}
  render();
}

function listingsComputed() {
  return state.listings.map((l) => ({ ...l, ...computeListingStatus(keyOf(l.property, l.unit), state.tenants) }));
}

function computeStats() {
  const tenants = state.tenants;
  const lc = listingsComputed();
  const totalInquiries = tenants.length;
  const awarded = tenants.filter((t) => t.status === "Awarded/ Leased").length;
  const lost = tenants.filter((t) => t.status === "Lost/ Inactive").length;
  const active = totalInquiries - awarded - lost;
  const conversionRate = totalInquiries ? awarded / totalInquiries : 0;

  const totalUnits = lc.length;
  const available = lc.filter((l) => l.kind === "available").length;
  const occupied = lc.filter((l) => l.kind === "occupied").length;
  const occupancyRate = totalUnits ? occupied / totalUnits : 0;

  const byStage = allStatuses().map((s) => ({ stage: s, count: tenants.filter((t) => t.status === s).length }));

  const byProperty = PROPERTIES.filter((p) => lc.some((l) => l.property === p)).map((p) => {
    const units = lc.filter((l) => l.property === p);
    const total = units.length;
    const avail = units.filter((l) => l.kind === "available").length;
    const occ = units.filter((l) => l.kind === "occupied").length;
    return { property: p, total, available: avail, occupied: occ, occupancyPct: total ? occ / total : 0 };
  });

  const pipeline = tenants
    .filter((t) => t.status !== "Awarded/ Leased" && t.status !== "Lost/ Inactive")
    .slice()
    .sort((a, b) => (b.dateInquired || "").localeCompare(a.dateInquired || ""))
    .slice(0, 8);

  const todayMs = new Date(new Date().toDateString()).getTime();
  const ACTIVE_STATUSES = ["Inquired", "Pending Requirements", "Under Evaluation"];
  const needsFollowUp = tenants
    .filter((t) => ACTIVE_STATUSES.includes(t.status) && t.dateInquired)
    .map((t) => {
      const inquired = new Date(t.dateInquired + "T00:00:00").getTime();
      const daysWaiting = Math.floor((todayMs - inquired) / 86400000);
      return { ...t, daysWaiting };
    })
    .filter((t) => t.daysWaiting >= 14)
    .sort((a, b) => b.daysWaiting - a.daysWaiting)
    .slice(0, 6);

  const upcoming = [];
  tenants.forEach((t) => {
    [["unitViewing", "Unit viewing"], ["foodTasting", "Food tasting"]].forEach(([field, label]) => {
      const dateStr = t[field];
      if (!dateStr) return;
      const eventMs = new Date(dateStr + "T00:00:00").getTime();
      const daysOut = Math.round((eventMs - todayMs) / 86400000);
      if (daysOut >= 0 && daysOut <= 7) upcoming.push({ tenant: t, label, dateStr, daysOut });
    });
  });
  upcoming.sort((a, b) => a.dateStr.localeCompare(b.dateStr));

  const maint = state.maintenance;
  const maintOpen = maint.filter((m) => m.status === "Open").length;
  const maintInProgress = maint.filter((m) => m.status === "In Progress").length;
  const maintUrgent = maint.filter((m) => (m.status === "Open" || m.status === "In Progress") && m.priority === "Urgent").length;
  const maintNeedsAttention = maint
    .filter((m) => m.status === "Open" || m.status === "In Progress")
    .map((m) => {
      const dMs = m.reportedDate ? new Date(m.reportedDate + "T00:00:00").getTime() : todayMs;
      const daysOpen = Math.max(0, Math.floor((todayMs - dMs) / 86400000));
      return { ...m, daysOpen };
    })
    .sort((a, b) => {
      const rank = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
      if (rank[a.priority] !== rank[b.priority]) return rank[a.priority] - rank[b.priority];
      return b.daysOpen - a.daysOpen;
    })
    .slice(0, 6);

  return {
    totalInquiries, awarded, lost, active, conversionRate,
    totalUnits, available, occupied, occupancyRate,
    byStage, byProperty, pipeline, needsFollowUp, upcoming: upcoming.slice(0, 6),
    maintTotal: maint.length, maintOpen, maintInProgress, maintUrgent, maintNeedsAttention,
  };
}

function filteredTenants() {
  return state.tenants
    .filter((t) => (state.tenantStatusFilter === "All" ? true : t.status === state.tenantStatusFilter))
    .filter((t) => (state.tenantPropertyFilter === "All" ? true : t.property === state.tenantPropertyFilter))
    .filter((t) => {
      if (!state.tenantSearch.trim()) return true;
      const q = state.tenantSearch.toLowerCase();
      return [t.brand, t.contact, t.concept, t.property, t.unit, t.email].some((v) => (v || "").toLowerCase().includes(q));
    })
    .slice()
    .sort((a, b) => (b.dateInquired || "").localeCompare(a.dateInquired || ""));
}

        <div class="mark">P</div>
        <div>
          <h1>PLUD</h1>
          <p>Leasing Tracker</p>
        </div>
      </div>
      <p class="login-lede">Sign in to view and manage the leasing pipeline.</p>
      <div id="login-error">${state.loginError ? `<div class="form-error" style="margin-bottom:16px;">${icon("alert", 16)} ${esc(state.loginError)}</div>` : ""}</div>
      <div class="login-fields">
        <label>
          <span class="field-label">Username</span>
          <input id="auth-name" class="input" placeholder="e.g. admin" autofocus autocomplete="username" onkeydown="onAuthKeydown(event)" />
        </label>
        <label>
          <span class="field-label">Password</span>
          <input type="password" id="auth-password" class="input" placeholder="Enter your password" autocomplete="current-password" onkeydown="onAuthKeydown(event)" />
        </label>
      </div>
      <button type="button" id="auth-submit-btn" class="btn btn-primary btn-block" style="margin-top:24px;" onclick="onAuthSubmit(event)"><span id="auth-submit-label">Sign in</span></button>
    </div>
  </div>`;
}

function onAuthKeydown(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    onAuthSubmit(e);
  }
}

function setLoginError(msg) {
  state.loginError = msg;
  const el = document.getElementById("login-error");
  if (el) el.innerHTML = `<div class="form-error" style="margin-bottom:16px;">${icon("alert", 16)} ${esc(msg)}</div>`;
}

function setAuthSubmitting(on) {
  const btn = document.getElementById("auth-submit-btn");
  if (!btn) return;
  btn.disabled = on;
  if (on) {
    btn.innerHTML = `Signing in <span class="btn-progress-track"><span class="btn-progress-fill"></span></span>`;
  } else {
    btn.innerHTML = `<span id="auth-submit-label">Sign in</span>`;
  }
}

async function onAuthSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  const name = document.getElementById("auth-name").value;
  const password = document.getElementById("auth-password").value;
  if (!name.trim()) { setLoginError("Enter a username."); return false; }
  if (!password) { setLoginError("Enter a password."); return false; }
  setAuthSubmitting(true);
  await loginWithPassword(name, password);
  setAuthSubmitting(false);
  return false;
}

function openNewTenant() { state.showNewTenant = true; state.editingTenant = null; state.formError = ""; render(); }

function goToTenantsForListing(listingId) {
  const l = state.listings.find((x) => x.id === listingId);
  if (!l) return;
  state.tab = "tenants";
  state.tenantPropertyFilter = l.property;
  state.tenantStatusFilter = "All";
  state.tenantSearch = l.unit;
  render();
}
function closeTenantModal() { state.showNewTenant = false; state.editingTenant = null; state.formError = ""; render(); }

function onCategoryChange() {
  const cat = document.getElementById("t-category").value;
  const concepts = allConceptsFor(cat);
  document.getElementById("t-concept").innerHTML = `<option value="">Select concept</option>` + concepts.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
}
function onPropertyChange() {
  const prop = document.getElementById("t-property").value;
  const units = unitsByProperty()[prop] || [];
  const sel = document.getElementById("t-unit");
  sel.innerHTML = `<option value="">Select unit</option>` + units.map((u) => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  sel.disabled = !prop;
}

function saveTenant() {
  const val = (id) => document.getElementById(id).value;
  const form = {
    dateInquired: val("t-dateInquired"),

    email: val("t-email"),

    unit: val("t-unit"),
    unitViewing: val("t-unitViewing"),

  }

  const record = { ...form, id };

  if (state.editingTenant) {
    state.tenants = state.tenants.map((t) => (t.id === id ? record : t));
  } else {
    state.tenants = [record, ...state.tenants];
  }
  state.showNewTenant = false;
  state.editingTenant = null;
  state.formError = "";
  render();

  sb.from("plud_tenants").upsert(tenantStateToRow(record)).then(({ error }) => {
    if (error) {
      console.error("Supabase save (tenant) failed:", error);
      state.saveError = "Changes aren't saving to the database right now.";
    } else {
      state.saveError = "";
    }
    const el = document.getElementById("save-banner");
    if (el) el.outerHTML = bannerHtml();
  });
}

function updateListingEstimate() {
  const fa = parseFloat(document.getElementById("l-floorArea").value);
  const ar = parseFloat(document.getElementById("l-askingRate").value);
  document.getElementById("l-estimate").textContent = (fa && ar) ? fmtMoney(fa * ar) : "—";
}

function saveListing() {
  const fa = document.getElementById("l-floorArea").value;
  const ar = document.getElementById("l-askingRate").value;
  const notes = document.getElementById("l-notes").value;

  const showErr = (msg) => {
    state.listingFormError = msg;
    document.getElementById("l-error").innerHTML = `<div class="form-error">${icon("alert", 16)} ${esc(msg)}</div>`;
  };

  if (state.showNewListing) {
    const property = document.getElementById("l-property").value;
    const unit = document.getElementById("l-unit").value.trim();
    if (!property) { showErr("Select a property."); return; }
    if (!unit) { showErr("Enter a unit name."); return; }
    if (state.listings.some((p) => p.property === property && p.unit.toLowerCase() === unit.toLowerCase())) {
      showErr("That property/unit combination already exists.");
      return;
    }
    const record = { id: uid("L"), property, unit, floorArea: fa === "" ? "" : Number(fa), askingRate: ar === "" ? "" : Number(ar), notes };
    state.listings = [...state.listings, record];
    state.showNewListing = false;
    state.listingFormError = "";
    render();

    sb.from("plud_listings").upsert(listingStateToRow(record)).then(({ error }) => {
      if (error) {
        console.error("Supabase save (listing) failed:", error);
        state.saveError = "Changes aren't saving to the database right now.";
      } else {
        state.saveError = "";
      }
      const el = document.getElementById("save-banner");
      if (el) el.outerHTML = bannerHtml();
    });
    return;
  }

  const id = state.editingListing.id;
  let updated = null;
  state.listings = state.listings.map((p) => {
    if (p.id !== id) return p;
    updated = { ...p, floorArea: fa === "" ? "" : Number(fa), askingRate: ar === "" ? "" : Number(ar), notes };
    return updated;
  });
  state.editingListing = null;
  render();

  sb.from("plud_listings").upsert(listingStateToRow(updated)).then(({ error }) => {
    if (error) {
      console.error("Supabase save (listing) failed:", error);
      state.saveError = "Changes aren't saving to the database right now.";
    } else {
      state.saveError = "";
    }
    const el = document.getElementById("save-banner");
    if (el) el.outerHTML = bannerHtml();
  });
}

const REPORT_TYPES = [
  { id: "pipeline", label: "Leasing Pipeline" },
  { id: "occupancy", label: "Occupancy" },
  { id: "maintenance", label: "Maintenance" },
];

function inReportDateRange(dateStr) {
  if (!state.reportFrom && !state.reportTo) return true;
  if (!dateStr) return false;
  if (state.reportFrom && dateStr < state.reportFrom) return false;
  if (state.reportTo && dateStr > state.reportTo) return false;
  return true;
}
function matchesReportSearch(fields) {
  if (!state.reportSearch.trim()) return true;
  const q = state.reportSearch.toLowerCase();
  return fields.some((v) => (v || "").toString().toLowerCase().includes(q));
}

function reportPipelineRows() {
  return state.tenants
    .filter((t) => inReportDateRange(t.dateInquired))
    .filter((t) => matchesReportSearch([t.brand, t.concept, t.contact, t.property, t.unit, t.email, t.category, t.status]))
    .slice()
    .sort((a, b) => (b.dateInquired || "").localeCompare(a.dateInquired || ""));
}
function reportMaintenanceRows() {
  return state.maintenance
    .filter((m) => inReportDateRange(m.reportedDate))
    .filter((m) => matchesReportSearch([m.issue, m.property, m.unit, m.assignedTo, m.priority, m.status, m.notes]))
    .slice()
    .sort((a, b) => (b.reportedDate || "").localeCompare(a.reportedDate || ""));
}
function reportOccupancyRows() {
  return listingsComputed()
    .filter((l) => inReportDateRange(l.createdAt))
    .filter((l) => matchesReportSearch([l.property, l.unit, l.label, l.notes]));
}

function reportOccupancyHtml() {
  const rows = reportOccupancyRows();

  const rate = total ? Math.round((occupied / total) * 100) : 0;
  return `

            <td>${l.floorArea && l.askingRate ? fmtMoney(Number(l.floorArea) * Number(l.askingRate)) : "—"}</td>

function setReportType(id) {
  state.reportType = id;
  render();
}
function onReportDateChange(field, value) {
  state[field] = value;
  const el = document.getElementById("report-body");
  if (el) el.innerHTML = reportBodyHtml();
}
function onReportSearch(value) {
  state.reportSearch = value;
  const el = document.getElementById("report-body");
  if (el) el.innerHTML = reportBodyHtml();
}

function csvEscape(v) {
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadCsv(filename, rows) {
  const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportReportCsv() {
  if (state.reportType === "pipeline") {
    const header = ["Date inquired", "Brand/tenant", "Category", "Concept", "Property", "Unit", "Contact", "Mobile", "Email", "Status", "Remarks"];
    const data = reportPipelineRows().map((t) => [t.dateInquired, t.brand, t.category, t.concept, t.property, t.unit, t.contact, t.mobile, t.email, t.status, t.remarks]);
    downloadCsv("plud-leasing-pipeline.csv", [header, ...data]);
  } else if (state.reportType === "maintenance") {
    const header = ["Reported date", "Property", "Unit", "Issue", "Priority", "Status", "Assigned to", "Resolved date", "Notes"];
    const data = reportMaintenanceRows().map((m) => [m.reportedDate, m.property, m.unit, m.issue, m.priority, m.status, m.assignedTo, m.resolvedDate, m.notes]);
    downloadCsv("plud-maintenance.csv", [header, ...data]);
  } else {
    const header = ["Property", "Unit", "Floor area (sqm)", "Asking rate (PHP/sqm)", "Est. monthly rent", "Status", "Active inquiries"];
    const data = reportOccupancyRows().map((l) => [
      l.property, l.unit, l.floorArea, l.askingRate,
      l.floorArea && l.askingRate ? Number(l.floorArea) * Number(l.askingRate) : "",
      l.label, l.count,
    ]);
    downloadCsv("plud-occupancy.csv", [header, ...data]);
  }
}

      ${state.users.length === 0 ? `<p class="empty-note">No users found.</p>` : `
      <div class="table-wrap"><div class="table-scroll">
        <table class="data narrow">
          <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Added</th><th class="right">Actions</th></tr></thead>
          <tbody>
            ${state.users.map((u) => `
              <tr>
                <td style="font-weight:500;color:var(--stone-900);">${esc(u.username)}</td>
                <td>${esc(u.name || "—")}</td>
                <td>${esc(u.role || "—")}</td>
                <td>${fmtDate(u.created_at ? u.created_at.slice(0, 10) : "")}</td>
                <td class="right">
                  <button class="icon-btn danger" onclick="askDeleteUser('${u.id}')" aria-label="Delete" ${state.users.length <= 1 ? 'disabled title="At least one user must remain"' : ""}>${icon("trash", 15)}</button>

function openNewUser() { state.showNewUser = true; state.userFormError = ""; render(); }
function closeUserModal() { state.showNewUser = false; state.userFormError = ""; render(); }

function userModalHtml() {
  return `
  <div class="overlay">
    <div class="modal narrow">
      <div class="modal-header">
        <h2>Add user</h2>
        <button class="icon-btn" onclick="closeUserModal()" aria-label="Close">${icon("x", 18)}</button>
      </div>
      <div class="modal-body">
        <div id="u-error">${state.userFormError ? `<div class="form-error">${icon("alert", 16)} ${esc(state.userFormError)}</div>` : ""}</div>
        <label><span class="field-label">Username</span><input id="u-username" class="input" placeholder="e.g. sam" autofocus /></label>
        <label><span class="field-label">Name (optional)</span><input id="u-name" class="input" placeholder="e.g. Sam Bouteldja" /></label>
        <label><span class="field-label">Role (optional)</span><input id="u-role" class="input" placeholder="e.g. Leasing Manager" /></label>
        <div class="grid-2">
          <label><span class="field-label">Password</span><input type="password" id="u-password" class="input" placeholder="Create a password" autocomplete="new-password" /></label>
          <label><span class="field-label">Confirm password</span><input type="password" id="u-password2" class="input" placeholder="Re-enter password" autocomplete="new-password" /></label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNewUser()">Add user</button>
      </div>
    </div>

}

async function saveNewUser() {
  const val = (id) => document.getElementById(id).value;
  const username = val("u-username").trim().toLowerCase();
  const name = val("u-name").trim();
  const role = val("u-role").trim();
  const password = val("u-password");
  const password2 = val("u-password2");

  const showErr = (msg) => {
    state.userFormError = msg;
    document.getElementById("u-error").innerHTML = `<div class="form-error">${icon("alert", 16)} ${esc(msg)}</div>`;
  };

  if (!username) { showErr("Enter a username."); return; }
  if (!password || password.length < 4) { showErr("Password must be at least 4 characters."); return; }
  if (password !== password2) { showErr("Passwords don't match."); return; }
  if (state.users.some((u) => u.username.toLowerCase() === username)) { showErr("That username is already taken."); return; }

  const salt = randomSalt();
  const passwordHash = await hashPassword(password, salt);
  const row = { id: uid("U"), username, salt, password_hash: passwordHash, name, role };

  try {
    const { error } = await sb.from("plud_users").insert(row);
    if (error) throw error;
    state.users = [...state.users, { id: row.id, username, name, role, created_at: new Date().toISOString() }];
    state.showNewUser = false;
    state.userFormError = "";
    render();
  } catch (e) {
    console.error("Supabase add user failed:", e);
    showErr("Couldn't save this user — try again.");
  }
}

function askDeleteUser(id) {
  if (state.users.length <= 1) return;
  state.deletingUserId = id;
  render();
}
function cancelDeleteUser() { state.deletingUserId = null; render(); }
async function confirmDeleteUser() {
  const id = state.deletingUserId;
  const wasSelf = state.user && state.user.id === id;
  state.users = state.users.filter((u) => u.id !== id);
  state.deletingUserId = null;
  render();
  try {
    const { error } = await sb.from("plud_users").delete().eq("id", id);
    if (error) throw error;
  } catch (e) {
    console.error("Supabase delete user failed:", e);
  }
  if (wasSelf) await logout();
}
function confirmDeleteUserDialogHtml() {
  return `
  <div class="overlay">
    <div class="modal confirm">
      <h2 style="font-size:16px;font-weight:600;margin:0;color:var(--stone-900);">Remove this user?</h2>
      <p style="margin:8px 0 0;font-size:14px;color:var(--stone-600);">They won't be able to sign in anymore. This can't be undone.</p>
      <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-outline" onclick="cancelDeleteUser()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteUser()">Remove</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------- */
/* Category / Concept / Status options                                     */
/* ---------------------------------------------------------------------- */
function categorySelectOptionsHtml() {
  return allCategories().map((c) => `<option value="${esc(c)}">${esc(c)}${CATEGORIES.includes(c) ? " (built-in)" : ""}</option>`).join("");
}
function conceptSelectOptionsHtml() {
  const cat = state.settingsConceptCategory || allCategories()[0] || "";
  const builtIn = CATEGORY_CONCEPTS[cat] || [];
  const list = allConceptsFor(cat);
  if (list.length === 0) return `<option value="">No concepts yet</option>`;
  return list.map((c) => `<option value="${esc(c)}">${esc(c)}${builtIn.includes(c) ? " (built-in)" : ""}</option>`).join("");
}
function statusSelectOptionsHtml() {
  return allStatuses().map((s) => `<option value="${esc(s)}">${esc(s)}${STATUSES.includes(s) ? " (built-in)" : ""}</option>`).join("");
}

function onSettingsConceptCategoryChange(value) {
  state.settingsConceptCategory = value;
  const el = document.getElementById("concept-select");
  if (el) el.innerHTML = conceptSelectOptionsHtml();
}

function showOptionError(type, msg) {
  const el = document.getElementById(`option-error-${type}`);
  if (el) el.innerHTML = msg ? `<div class="form-error" style="margin-top:8px;">${icon("alert", 16)} ${esc(msg)}</div>` : "";
}

async function deleteSelectedCategory() {
  const value = document.getElementById("category-select").value;
  showOptionError("category", "");
  if (CATEGORIES.includes(value)) { showOptionError("category", "Built-in categories can't be deleted."); return; }
  const opt = state.customCategories.find((o) => o.value === value);
  if (!opt) return;
  await deleteCustomOption(opt.id);
  document.getElementById("category-select").innerHTML = categorySelectOptionsHtml();
}

async function deleteSelectedConcept() {
  const value = document.getElementById("concept-select").value;
  const cat = state.settingsConceptCategory || allCategories()[0] || "";
  showOptionError("concept", "");
  if ((CATEGORY_CONCEPTS[cat] || []).includes(value)) { showOptionError("concept", "Built-in concepts can't be deleted."); return; }
  const opt = state.customConcepts.find((o) => o.value === value && o.parent_category === cat);
  if (!opt) return;
  await deleteCustomOption(opt.id);
  document.getElementById("concept-select").innerHTML = conceptSelectOptionsHtml();
}

async function deleteSelectedStatus() {
  const value = document.getElementById("status-select").value;
  showOptionError("status", "");
  if (STATUSES.includes(value)) { showOptionError("status", "Built-in statuses can't be deleted."); return; }
  const opt = state.customStatuses.find((o) => o.value === value);
  if (!opt) return;
  await deleteCustomOption(opt.id);
  document.getElementById("status-select").innerHTML = statusSelectOptionsHtml();
}

async function addCustomCategory() {
  const input = document.getElementById("new-category-value");
  const value = input.value.trim();
  showOptionError("category", "");
  if (!value) { showOptionError("category", "Enter a category name."); return; }
  if (allCategories().some((c) => c.toLowerCase() === value.toLowerCase())) { showOptionError("category", "That category already exists."); return; }

  const row = { id: uid("OPT"), option_type: "category", value, parent_category: "" };
  try {
    const { error } = await sb.from("plud_custom_options").insert(row);
    if (error) throw error;
    state.customCategories = [...state.customCategories, row];
    input.value = "";
    render(); // category lists appear in several selects across the app
  } catch (e) {
    console.error("Add category failed:", e);
    showOptionError("category", "Couldn't save this category — try again.");
  }
}

async function addCustomConcept() {
  const input = document.getElementById("new-concept-value");
  const value = input.value.trim();
  const cat = state.settingsConceptCategory || allCategories()[0] || "";
  showOptionError("concept", "");
  if (!cat) { showOptionError("concept", "Choose a category first."); return; }
  if (!value) { showOptionError("concept", "Enter a concept name."); return; }
  if (allConceptsFor(cat).some((c) => c.toLowerCase() === value.toLowerCase())) { showOptionError("concept", "That concept already exists for this category."); return; }

  const row = { id: uid("OPT"), option_type: "concept", value, parent_category: cat };
  try {
    const { error } = await sb.from("plud_custom_options").insert(row);
    if (error) throw error;
    state.customConcepts = [...state.customConcepts, row];
    input.value = "";
    document.getElementById("concept-select").innerHTML = conceptSelectOptionsHtml();
  } catch (e) {
    console.error("Add concept failed:", e);
    showOptionError("concept", "Couldn't save this concept — try again.");
  }
}

async function addCustomStatus() {
  const input = document.getElementById("new-status-value");
  const value = input.value.trim();
  showOptionError("status", "");
  if (!value) { showOptionError("status", "Enter a status name."); return; }
  if (allStatuses().some((s) => s.toLowerCase() === value.toLowerCase())) { showOptionError("status", "That status already exists."); return; }

  const row = { id: uid("OPT"), option_type: "status", value, parent_category: "" };
  try {
    const { error } = await sb.from("plud_custom_options").insert(row);
    if (error) throw error;
    state.customStatuses = [...state.customStatuses, row];
    input.value = "";
    render(); // status list also drives the pipeline chart and filters elsewhere
  } catch (e) {
    console.error("Add status failed:", e);
    showOptionError("status", "Couldn't save this status — try again.");
  }
}

async function deleteCustomOption(id) {
  const opt = [...state.customCategories, ...state.customConcepts, ...state.customStatuses].find((o) => o.id === id);
  if (!opt) return;
  state.customCategories = state.customCategories.filter((o) => o.id !== id);
  state.customConcepts = state.customConcepts.filter((o) => o.id !== id);
  state.customStatuses = state.customStatuses.filter((o) => o.id !== id);
  render();
  try {
    const { error } = await sb.from("plud_custom_options").delete().eq("id", id);
    if (error) throw error;
  } catch (e) {
    console.error("Delete option failed:", e);
  }
}


/* ---------------------------------------------------------------------- */
/* Maintenance                                                             */
/* ---------------------------------------------------------------------- */
function maintenanceTabHtml() {
  return `
  <div>
    <div class="toolbar">
      <select class="input auto" onchange="onMaintStatusFilter(this.value)">
        <option value="All" ${state.maintStatusFilter === "All" ? "selected" : ""}>All statuses</option>
        ${MAINT_STATUSES.map((s) => `<option value="${esc(s)}" ${state.maintStatusFilter === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
      </select>
      <select class="input auto" onchange="onMaintPropertyFilter(this.value)">
        <option value="All" ${state.maintPropertyFilter === "All" ? "selected" : ""}>All properties</option>
        ${PROPERTIES.map((p) => `<option value="${esc(p)}" ${state.maintPropertyFilter === p ? "selected" : ""}>${esc(p)}</option>`).join("")}
      </select>
      <div style="flex:1;"></div>
      <button class="btn btn-primary" onclick="openNewMaint()">${icon("plus", 16)} New request</button>
    </div>
    <div id="maint-results">${maintResultsHtml()}</div>
  </div>`;
}

function maintResultsHtml() {
  const rows = filteredMaintenance();
  if (rows.length === 0) {
    return `
    <div class="empty-state">
      <p class="title">No maintenance requests match these filters.</p>
      <p class="sub">Try clearing filters, or log a new request.</p>
    </div>`;
  }
  return `
  <div class="table-wrap"><div class="table-scroll">
    <table class="data">
      <thead><tr>
        <th>Reported</th><th>Property / unit</th><th>Issue</th><th>Priority</th><th>Assigned to</th><th>Status</th><th class="right">Actions</th>
      </tr></thead>
      <tbody>
        ${rows.map((m) => `
          <tr>
            <td style="white-space:nowrap;">${fmtDate(m.reportedDate)}</td>
            <td>${esc(m.property)}${m.unit ? " · " + esc(m.unit) : ""}</td>
            <td>
              <p class="cell-title">${esc(m.issue || "(no description)")}</p>
              ${m.resolvedDate ? `<p class="cell-sub">Resolved ${fmtDate(m.resolvedDate)}</p>` : ""}
            </td>
            <td>${badgeHtml(m.priority, MAINT_PRIORITY_STYLE)}</td>
            <td>${esc(m.assignedTo || "—")}</td>
            <td>${badgeHtml(m.status, MAINT_STATUS_STYLE)}</td>
            <td>
              <div class="row-actions">
                <button class="icon-btn" onclick="openEditMaint('${m.id}')" aria-label="Edit">${icon("pencil", 15)}</button>
                <button class="icon-btn danger" onclick="askDeleteMaint('${m.id}')" aria-label="Delete">${icon("trash", 15)}</button>
              </div>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>
  </div></div>`;
}

function onMaintStatusFilter(v) {
  state.maintStatusFilter = v;
  document.getElementById("maint-results").innerHTML = maintResultsHtml();
}
function onMaintPropertyFilter(v) {
  state.maintPropertyFilter = v;
  document.getElementById("maint-results").innerHTML = maintResultsHtml();
}

function openNewMaint() { state.showNewMaint = true; state.editingMaint = null; state.maintFormError = ""; render(); }
function openEditMaint(id) { state.editingMaint = state.maintenance.find((m) => m.id === id) || null; state.showNewMaint = false; state.maintFormError = ""; render(); }
function closeMaintModal() { state.showNewMaint = false; state.editingMaint = null; state.maintFormError = ""; render(); }

function onMaintPropertyChange() {
  const prop = document.getElementById("m-property").value;
  const units = unitsByProperty()[prop] || [];
  const sel = document.getElementById("m-unit");
  sel.innerHTML = `<option value="">Select unit</option>` + units.map((u) => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  sel.disabled = !prop;
}

function maintModalHtml() {
  const m = state.editingMaint || {
    property: "", unit: "", issue: "", priority: "Medium", status: "Open",
    reportedDate: new Date().toISOString().slice(0, 10), assignedTo: "", resolvedDate: "", notes: "",
  };
  const units = m.property ? (unitsByProperty()[m.property] || []) : [];

  return `
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>${state.editingMaint ? "Edit maintenance request" : "New maintenance request"}</h2>
        <button class="icon-btn" onclick="closeMaintModal()" aria-label="Close">${icon("x", 18)}</button>
      </div>
      <div class="modal-body">
        <div id="m-error">${state.maintFormError ? `<div class="form-error">${icon("alert", 16)} ${esc(state.maintFormError)}</div>` : ""}</div>

        <div class="grid-2">
          <label><span class="field-label">Property</span>
            <select id="m-property" class="input" onchange="onMaintPropertyChange()">
              <option value="">Select property</option>
              ${PROPERTIES.map((p) => `<option value="${esc(p)}" ${m.property === p ? "selected" : ""}>${esc(p)}</option>`).join("")}
            </select>
          </label>
          <label><span class="field-label">Unit</span>
            <select id="m-unit" class="input" ${!m.property ? "disabled" : ""}>
              <option value="">Select unit</option>
              ${units.map((u) => `<option value="${esc(u)}" ${m.unit === u ? "selected" : ""}>${esc(u)}</option>`).join("")}
            </select>
          </label>
        </div>

        <label><span class="field-label">Issue description</span>
          <textarea id="m-issue" class="input" rows="2" placeholder="What's wrong, and where?">${esc(m.issue)}</textarea>
        </label>

        <div class="grid-2">
          <label><span class="field-label">Priority</span>
            <select id="m-priority" class="input">
              ${MAINT_PRIORITIES.map((p) => `<option value="${esc(p)}" ${m.priority === p ? "selected" : ""}>${esc(p)}</option>`).join("")}
            </select>
          </label>
          <label><span class="field-label">Status</span>
            <select id="m-status" class="input">
              ${MAINT_STATUSES.map((s) => `<option value="${esc(s)}" ${m.status === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label><span class="field-label">Reported date</span><input type="date" id="m-reportedDate" class="input" value="${esc(m.reportedDate)}" /></label>
          <label><span class="field-label">Assigned to</span><input id="m-assignedTo" class="input" placeholder="e.g. Building Engineering" value="${esc(m.assignedTo)}" /></label>
        </div>

        <label><span class="field-label">Resolved date (if applicable)</span><input type="date" id="m-resolvedDate" class="input" value="${esc(m.resolvedDate)}" /></label>

        <label><span class="field-label">Notes</span>
          <textarea id="m-notes" class="input" rows="3" placeholder="Follow-up notes, contractor details...">${esc(m.notes)}</textarea>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeMaintModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveMaint()">${state.editingMaint ? "Save changes" : "Add request"}</button>
      </div>
    </div>
  </div>`;
}

function saveMaint() {
  const val = (id) => document.getElementById(id).value;
  const form = {
    property: val("m-property"),
    unit: val("m-unit"),
    issue: val("m-issue"),
    priority: val("m-priority"),
    status: val("m-status"),
    reportedDate: val("m-reportedDate"),
    assignedTo: val("m-assignedTo"),
    resolvedDate: val("m-resolvedDate"),
    notes: val("m-notes"),
  };

  if (!form.property) {
    state.maintFormError = "Select a property before saving.";
    document.getElementById("m-error").innerHTML = `<div class="form-error">${icon("alert", 16)} ${esc(state.maintFormError)}</div>`;
    return;
  }
  if (!form.issue.trim()) {
    state.maintFormError = "Describe the issue before saving.";
    document.getElementById("m-error").innerHTML = `<div class="form-error">${icon("alert", 16)} ${esc(state.maintFormError)}</div>`;
    return;
  }

  const id = state.editingMaint ? state.editingMaint.id : uid("M");
  const record = { ...form, id };

  if (state.editingMaint) {
    state.maintenance = state.maintenance.map((m) => (m.id === id ? record : m));
  } else {
    state.maintenance = [record, ...state.maintenance];
  }
  state.showNewMaint = false;
  state.editingMaint = null;
  state.maintFormError = "";
  render();

  sb.from("plud_maintenance").upsert(maintStateToRow(record)).then(({ error }) => {
    if (error) {
      console.error("Supabase save (maintenance) failed:", error);
      state.saveError = "Changes aren't saving to the database right now.";
    } else {
      state.saveError = "";
    }
    const el = document.getElementById("save-banner");
    if (el) el.outerHTML = bannerHtml();
  });
}

function askDeleteMaint(id) { state.deletingMaintId = id; render(); }
function cancelDeleteMaint() { state.deletingMaintId = null; render(); }
function confirmDeleteMaint() {
  const id = state.deletingMaintId;
  state.maintenance = state.maintenance.filter((m) => m.id !== id);
  state.deletingMaintId = null;
  render();

  sb.from("plud_maintenance").delete().eq("id", id).then(({ error }) => {
    if (error) {
      console.error("Supabase delete (maintenance) failed:", error);
      state.saveError = "Changes aren't saving to the database right now.";
    } else {
      state.saveError = "";
    }
    const el = document.getElementById("save-banner");
    if (el) el.outerHTML = bannerHtml();
  });
}
function confirmDeleteMaintDialogHtml() {
  return `
  <div class="overlay">
    <div class="modal confirm">
      <h2 style="font-size:16px;font-weight:600;margin:0;color:var(--stone-900);">Delete this request?</h2>
      <p style="margin:8px 0 0;font-size:14px;color:var(--stone-600);">This removes the maintenance record permanently. This can't be undone.</p>
      <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-outline" onclick="cancelDeleteMaint()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteMaint()">Delete</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------- */
/* Render                                                                  */
/* ---------------------------------------------------------------------- */
function render() {
  const root = document.getElementById("root");
  if (state.userLoading) { root.innerHTML = spinnerHtml("full"); return; }
  if (!state.user) { root.innerHTML = loginScreenHtml(); return; }
  if (state.loading) { root.innerHTML = spinnerHtml("h96"); return; }
  root.innerHTML = appShellHtml();
}

init();
</script>
